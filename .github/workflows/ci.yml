name: CI

# Quality gate for the monorepo. What each job RUNS is not written here: a job
# runs one gate set of xtask.yaml at the repository root, and the tasks in
# that set are the one list — the same one `dart run :xtask check` runs on a
# developer's machine. What a job PROVIDES is written here: the checkout, the
# toolchain, the resolution a task cannot do for itself. `xtask --check-ci`
# (the `ci-drift` task, in `ci-tools`) refuses a step that names a command of
# its own without saying why, which is how the second copy of the list would
# grow back.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: format · analyze · codegen · doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # `stable` must satisfy the `sdk: ^3.12.0` bound in pubspec.yaml; pin
          # `flutter-version:` here if a stable release ever lags behind it.
          channel: stable
          cache: true

      - name: Resolve workspace
        # The workspace members are Flutter packages, and `dart run` in tools/
        # resolves tools/ alone. What must exist before a task runs.
        run: flutter pub get # xtask: not a gate — resolves the Flutter workspace the tasks then read

      - name: ci-workspace
        working-directory: tools
        run: dart run :xtask ci-workspace

  tools:
    name: frx CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # The binary is released for Linux, macOS and Windows, and until now only
    # Linux ever ran the suite: the other two got a three-command smoke test at
    # release time. Path handling is where a CLI differs across them, and 900
    # tests that never saw a backslash said nothing about it.
    #
    # Windows is `continue-on-error` for now — the suite was written on Linux
    # and has never been run there, so its first runs are information, not a
    # gate. Flip it to a gate (drop the key) once a run comes back green; a leg
    # that fails on `contains('app/lib/…')` in a message is a test to fix, not a
    # bug in frx, and the failures name themselves in the log.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: ci-tools
        # `dart run` resolves tools/ on its way in. The gate is: formatted,
        # analyzed, the suite (unit + the E2E round trips against a temp
        # fixture repo), and this workflow still running gate sets.
        run: dart run :xtask ci-tools

  installers:
    name: install scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The two scripts nobody runs from a checkout: they are fetched over curl and
    # executed on a machine that has never seen this repository, so a typo in
    # them is discovered by a stranger during their first minute with the tool.
    # Nothing else in CI reads them — the release workflow only publishes the
    # assets they download. shellcheck and pwsh are on the runner image.
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: ci-installers
        run: dart run :xtask ci-installers

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode/package-lock.json
      - uses: dart-lang/setup-dart@v1

      - name: Install
        # `ci`, not `install`: installs exactly the committed lock and fails if
        # package.json and the lock have drifted apart. The tasks' own
        # `npm install` then finds nothing to do.
        working-directory: tools/vscode
        run: npm ci # xtask: not a gate — the committed lock, installed exactly, before any task runs

      - name: ci-extension
        # The extension is TypeScript compiled to out/. The gate is: it
        # type-checks under `strict`, every command the manifest contributes or
        # menus reference is registered in source, the unit suite passes against
        # the compiled output, the integration suite passes in a real VS Code
        # under xvfb, and the VSIX actually builds.
        working-directory: tools
        run: dart run :xtask ci-extension
