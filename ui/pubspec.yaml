name: ui
description: The UI package.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.11.4

dependencies:
  equatable: ^2.0.8
  extended_image: ^10.0.1
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  image_picker: ^1.2.1
  localization:
    path: ../localization
  theme_extensions_builder_annotation: ^7.3.0

dev_dependencies:
  build_runner: ^2.13.1
  flutter_gen_runner: ^5.13.0
  pro_lints: ^5.1.0
  theme_extensions_builder: ^7.3.0

flutter_gen:
  output: lib/generated/
  colors:
    inputs:
      - assets/color/light.xml
      - assets/color/dark.xml
  integrations:
    flutter_svg: true
  assets:
    outputs:
      package_parameter_enabled: true

flutter:
  assets:
    - assets/svg/placeholders/
