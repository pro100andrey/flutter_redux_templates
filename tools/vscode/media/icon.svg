<!--
  The extension's marketplace icon. `icon.png` is rendered from this file:

      npm run icon        # rsvg-convert -w 128 -h 128 media/icon.svg -o media/icon.png

  Two chevrons, blue into purple — Flutter's colour running into Redux's.
  Drawn to survive 42 px, which is the size the marketplace list and the
  extensions sidebar actually show: round caps and joins so the strokes do not
  fray, 13 px of weight so they hold when the whole mark is a third of that, and
  a gap between the pair wide enough not to close up.

  The gradient runs across both chevrons rather than per-shape, so the pair reads
  as one object; at small sizes it flattens toward a single blue-violet, which is
  why neither end of the ramp is allowed near the background's value.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="frxRamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54C5F8"/>
      <stop offset="1" stop-color="#B191F2"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="27" fill="#0E1425"/>

  <g stroke="url(#frxRamp)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M34 40 L58 64 L34 88"/>
    <path d="M70 40 L94 64 L70 88"/>
  </g>
</svg>
